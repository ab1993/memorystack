version: '3.8'

services:
  db:
    image: postgres:17  # Pinning to 17 for stability
    container_name: memorystack_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: memorystack
    ports:
      - "5432:5432"
    volumes:
      # Mounting to the parent directory as suggested by the error
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: memorystack_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@memorystack.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  postgres_data: